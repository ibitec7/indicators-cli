[project]
name = "indicators-cli"
version = "1.3.0"
description = "A CLI tool to automate the process of generating technical indicators for stock market data."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Syed Ibrahim Omer", email = "syed.ibrahim.omer.2@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "openpyxl>=3.1.5",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "setuptools>=82.0.1",
    "xlsxwriter>=3.2.9",
    "yfinance>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/ibitec7/indicators-cli"
Repository = "https://github.com/ibitec7/indicators-cli"
Issues = "https://github.com/ibitec7/indicators-cli/issues"

[project.scripts]
indicators = "src.cli:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["*.json"]
